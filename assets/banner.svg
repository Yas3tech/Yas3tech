<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#1c2833"/><stop offset=".55" stop-color="#3B4D5C"/><stop offset="1" stop-color="#6f9a78"/>
<animate attributeName="x1" values="0;.4;0" dur="14s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="tx" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#B5D5B7"/></linearGradient>
<radialGradient id="glow" cx=".78" cy=".2" r=".6"><stop offset="0" stop-color="#B5D5B7" stop-opacity=".45"/><stop offset="1" stop-color="#B5D5B7" stop-opacity="0"/></radialGradient>
<clipPath id="r"><rect width="1200" height="300" rx="18"/></clipPath>
</defs>
<style>
.net line{stroke:#B5D5B7;stroke-opacity:.22;stroke-width:1;stroke-dasharray:4 6;animation:flow 6s linear infinite}
.net circle{fill:#dff0e0;opacity:.8;animation:pulse 3.6s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-100}}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:1;transform:scale(1.8)}}
.net circle{transform-box:fill-box;transform-origin:center}
.name{font:700 64px 'Segoe UI',Helvetica,Arial,sans-serif;fill:url(#tx);animation:rise 1.2s cubic-bezier(.2,.8,.2,1) both}
.sub{font:500 22px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6efe7;letter-spacing:.14em;animation:rise 1.2s .25s cubic-bezier(.2,.8,.2,1) both}
.tags{font:500 15px 'Consolas','Courier New',monospace;fill:#B5D5B7;animation:rise 1.2s .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.sweep{animation:sweep 7s 1.5s ease-in-out infinite}
@keyframes sweep{from{transform:translateX(-400px)}to{transform:translateX(1700px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
